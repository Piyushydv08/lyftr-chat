# Render Blueprint: New > Blueprint > pick this repo. Paths are relative to the repo root.
services:
  - type: web
    name: lyftr-chat-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false # paste "key1,key2" in the dashboard
      - key: LLM_MODEL
        value: gemini/gemini-2.5-flash-lite
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: CACHE_TYPE
        value: disk
      - key: CACHE_DIR
        value: /data/llm_cache
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false # e.g. https://lyftr-chat.vercel.app
      - key: LOG_LEVEL
        value: INFO

  - type: web
    name: lyftr-chat-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # e.g. https://lyftr-chat-c8fd.onrender.com
    headers:
      - path: /config.js
        name: Cache-Control
        value: no-store
